text-[18px]">person</span></div></div></div></div></header><main class="w-full pt-20 bg-surface"><div class="flex flex-col w-full h-[calc(100vh-5rem)] max-h-[calc(100vh-5rem)] overflow-hidden bg-surface justify-center items-center px-gutter py-space-md select-none">
<!-- Subtle Ambient Glow -->
<div class="absolute w-[560px] h-[560px] bg-primary-fixed/30 rounded-full blur-3xl pointer-events-none -z-10"></div>
<!-- Centered Success POS Card -->
<div class="w-full max-w-2xl bg-surface-container-lowest rounded-xl shadow-xl p-space-xl flex flex-col items-center text-center relative overflow-hidden">
<!-- Top Green Accent Strip -->
<div class="absolute top-0 left-0 right-0 h-2 bg-primary"></div>
<!-- Pulsing Animated Check Badge -->
<div class="relative flex items-center justify-center my-space-sm">
<div class="absolute inset-0 rounded-full bg-primary-fixed animate-ping opacity-25"></div>
<div class="w-28 h-28 rounded-full bg-surface-container-low flex items-center justify-center shadow-md">
<div class="w-20 h-20 rounded-full bg-primary flex items-center justify-center text-on-primary shadow-lg">
<span class="material-symbols-outlined text-[52px] leading-none" style="font-variation-settings: 'FILL' 1, 'wght' 700;">check</span>
</div>
</div>
</div>
<!-- Main Headline (Bilingual Hinglish Primary) -->
<h1 class="font-display-total-mobile text-display-total-mobile text-on-surface tracking-tight mt-space-sm mb-space-xs">
      Bill ban gaya
    </h1>
<p class="font-body-md text-body-md text-on-surface-variant font-medium">
      Invoice generated successfully
    </p>
<!-- Prominent Bill Details Capsule -->
<div class="w-full bg-surface-container rounded-xl py-space-md px-space-lg my-space-lg flex items-center justify-center gap-space-md shadow-sm">
<div class="flex items-center gap-space-xs">
<span class="material-symbols-outlined text-primary text-[28px]">receipt_long</span>
<span class="font-headline-lg text-headline-lg font-bold text-on-surface tracking-wide">BILL #214</span>
</div>
<span class="w-2.5 h-2.5 rounded-full bg-outline-variant"></span>
<div class="flex items-baseline gap-1">
<span class="font-headline-md text-headline-md font-bold text-primary">₹</span>
<span class="font-display-total-mobile text-display-total-mobile text-primary leading-none">182</span>
</div>
</div>
<!-- Action Buttons (Strictly 56px+ height, 16px radius, >=16px secondary micro-labels) -->
<div class="w-full flex flex-col gap-space-md mt-space-xs">
<!-- Top Row: Print and WhatsApp Share -->
<div class="grid grid-cols-2 gap-space-md w-full">
<!-- Print Button -->
<button class="group h-[80px] rounded-xl bg-surface-container-high hover:bg-surface-container-highest active:translate-y-0.5 transition-all duration-150 flex items-center justify-center gap-space-md px-space-md text-left shadow-sm" id="btnPrint" type="button">
<div class="w-12 h-12 rounded-lg bg-surface-container-lowest flex items-center justify-center text-on-surface shadow-sm group-hover:scale-105 transition-transform">
<span class="material-symbols-outlined text-[30px]" style="font-variation-settings: 'FILL' 1;">print</span>
</div>
<div class="flex flex-col">
<span class="font-title-hinglish text-title-hinglish text-on-surface leading-tight">Print</span>
<span class="font-label-sub-english text-label-sub-english text-on-surface-variant leading-normal">A4 / Receipt</span>
</div>
</button>
<!-- WhatsApp Button -->
<button class="group h-[80px] rounded-xl bg-surface-container-high hover:bg-surface-container-highest active:translate-y-0.5 transition-all duration-150 flex items-center justify-center gap-space-md px-space-md text-left shadow-sm" id="btnWhatsapp" type="button">
<div class="w-12 h-12 rounded-lg bg-primary-fixed flex items-center justify-center text-primary shadow-sm group-hover:scale-105 transition-transform">
<span class="material-symbols-outlined text-[30px]" style="font-variation-settings: 'FILL' 1;">share</span>
</div>
<div class="flex flex-col">
<span class="font-title-hinglish text-title-hinglish text-on-surface leading-tight">WhatsApp Bhejo</span>
<span class="font-label-sub-english text-label-sub-english text-on-surface-variant leading-normal">Share bill</span>
</div>
</button>
</div>
<!-- Main Action: Big Green Done Button -->
<button class="w-full h-[76px] rounded-xl bg-primary hover:bg-primary-container active:translate-y-0.5 transition-all duration-150 flex items-center justify-center gap-space-md px-space-lg text-on-primary shadow-md" id="btnDone" type="button">
<span class="material-symbols-outlined text-[34px] leading-none" style="font-variation-settings: 'wght' 700;">task_alt</span>
<div class="flex flex-col items-start text-left">
<span class="font-button-text text-button-text text-on-primary leading-tight">Done</span>
<span class="font-label-sub-english text-label-sub-english text-primary-fixed leading-normal">Naya bill shuru karein</span>
</div>
</button>
</div>
<!-- Quick Keyboard Shortcut Hint (Accessibility for Rapid Chemist Counters) -->
<div class="flex items-center justify-center gap-space-xs mt-space-lg text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]">keyboard</span>
<span class="font-label-sub-english text-label-sub-english">Enter dabayein agle bill ke liye (Press Enter for Next Bill)</span>
</div>
</div>
<script>
    (function () {
      const btnDone = document.getElementById('btnDone');
      const btnPrint = document.getElementById('btnPrint');
      const btnWhatsapp = document.getElementById('btnWhatsapp');

      function triggerNextBill() {
        if (btnDone) {
          btnDone.classList.add('scale-[0.98]');
          setTimeout(() => btnDone.classList.remove('scale-[0.98]'), 150);
        }
      }

      if (btnDone) {
        btnDone.addEventListener('click', triggerNextBill);
      }

      if (btnPrint) {
        btnPrint.addEventListener('click', function () {
          window.print();
        });
      }

      if (btnWhatsapp) {
        btnWhatsapp.addEventListener('click', function () {
          this.classList.add('bg-primary-fixed');
          setTimeout(() => this.classList.remove('bg-primary-fixed'), 400);
        });
      }

      // Enter key shortcut for retail speed
      window.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
          triggerNextBill();
        }
      });
    })();
  </script>
</div></main></body></html>
