<!DOCTYPE html>

<html class="h-full" lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0" name="viewport"/><meta content="web_blank" name="shell-type"/><link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;700;800&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base{html,body{margin:0;padding:0;}body{overscroll-behavior:none;}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config={darkMode:"class",theme:{extend:{colors:{"tertiary":"#924700","on-error-container":"#93000a","surface-tint":"#006d34","on-primary-fixed-variant":"#005226","surface-container-high":"#e0ebe5","on-tertiary-container":"#fffbff","surface-container-low":"#ebf6f0","surface-dim":"#d1ddd7","on-error":"#ffffff","on-tertiary-fixed-variant":"#723600","tertiary-fixed-dim":"#ffb786","on-secondary":"#ffffff","inverse-primary":"#72dc8e","on-primary-fixed":"#00210b","secondary-fixed":"#d4e3ff","secondary-container":"#54a0fe","surface-container-lowest":"#ffffff","tertiary-fixed":"#ffdcc6","error":"#ba1a1a","primary-container":"#088643","on-tertiary":"#ffffff","secondary-fixed-dim":"#a5c8ff","outline":"#6e7a6e","on-secondary-container":"#003567","on-secondary-fixed":"#001c3a","surface-container":"#e5f0eb","secondary":"#005faf","surface-container-highest":"#dae5df","surface":"#f1fcf6","on-primary":"#ffffff","background":"#f1fcf6","tertiary-container":"#b75b00","primary":"#006b33","surface-variant":"#dae5df","inverse-on-surface":"#e8f3ee","on-secondary-fixed-variant":"#004786","on-primary-container":"#f6fff3","on-tertiary-fixed":"#311300","error-container":"#ffdad6","on-background":"#141e1a","primary-fixed-dim":"#72dc8e","surface-bright":"#f1fcf6","on-surface-variant":"#3e4a3f","primary-fixed":"#8ef9a7","inverse-surface":"#28332f","on-surface":"#141e1a","outline-variant":"#bdcabc"},borderRadius:{DEFAULT:"0.25rem",lg:"0.5rem",xl:"0.75rem",full:"9999px"},spacing:{"space-sm":"0.75rem","margin-mobile":"1rem","space-lg":"1.5rem","space-md":"1rem","space-xl":"2.5rem",gutter:"1.5rem",margin:"2rem","space-xs":"0.5rem","gutter-compact":"1rem"},fontFamily:{"display-total":["Noto Sans"],"title-hinglish":["Noto Sans"],"body-lg":["Noto Sans"],"headline-lg":["Noto Sans"],"numpad-number":["Noto Sans"],"headline-md":["Noto Sans"],"label-sub-english":["Noto Sans"],"button-text":["Noto Sans"],"body-md":["Noto Sans"],"display-total-mobile":["Noto Sans"]},fontSize:{"display-total":["48px",{lineHeight:"56px",letterSpacing:"-0.02em",fontWeight:"800"}],"title-hinglish":["20px",{lineHeight:"26px",fontWeight:"700"}],"body-lg":["20px",{lineHeight:"28px",fontWeight:"500"}],"headline-lg":["28px",{lineHeight:"36px",fontWeight:"700"}],"numpad-number":["32px",{lineHeight:"38px",fontWeight:"700"}],"headline-md":["24px",{lineHeight:"32px",fontWeight:"700"}],"label-sub-english":["16px",{lineHeight:"20px",letterSpacing:"0.01em",fontWeight:"500"}],"button-text":["22px",{lineHeight:"28px",fontWeight:"700"}],"body-md":["18px",{lineHeight:"26px",fontWeight:"400"}],"display-total-mobile":["36px",{lineHeight:"44px",fontWeight:"800"}]}}}};</script></head><body class="min-h-full bg-surface text-on-surface font-body-md text-body-md flex items-center justify-center p-gutter"><main class="w-full max-w-lg mx-auto flex flex-col items-center justify-center"><div class="flex flex-col w-full">
<div class="w-full flex items-center justify-center p-space-sm sm:p-space-lg">
<div class="w-full max-w-[480px] bg-surface-container-lowest rounded-xl shadow-xl p-space-lg sm:p-space-xl flex flex-col relative overflow-hidden">
<!-- Hospivo Brand Header -->
<div class="flex flex-col items-center justify-center text-center">
<div class="flex items-center gap-space-xs mb-space-sm">
<div class="w-12 h-12 rounded-xl bg-primary flex items-center justify-center text-on-primary shadow-md">
<span class="material-symbols-outlined text-headline-lg" style="font-variation-settings: 'FILL' 1;">local_pharmacy</span>
</div>
<span class="font-headline-lg text-headline-lg tracking-tight text-primary">Hospivo</span>
</div>
<h1 class="font-numpad-number text-numpad-number text-on-surface tracking-tight mt-space-xs">
          Owner Login
        </h1>
<p class="font-label-sub-english text-label-sub-english text-outline mt-1">
          Owner sign in
        </p>
</div>
<!-- Authentication Form -->
<form class="flex flex-col mt-space-lg" onsubmit="event.preventDefault();">
<!-- Field 1: Email ya Phone -->
<div class="flex flex-col mb-space-md">
<label class="font-body-md text-body-md font-medium text-on-surface mb-2" for="identifier">
            Email ya phone
          </label>
<div class="relative w-full">
<input autocomplete="username" class="w-full h-14 px-4 font-label-sub-english text-label-sub-english text-on-surface bg-surface-container-lowest rounded-xl shadow-sm placeholder:text-outline focus:outline-none focus:bg-surface-bright transition-colors" id="identifier" placeholder="owner@email.com ya 9876543210" type="text"/>
</div>
</div>
<!-- Field 2: Password -->
<div class="flex flex-col mb-space-xs">
<label class="font-body-md text-body-md font-medium text-on-surface mb-2" for="password">
            Password
          </label>
<div class="relative w-full flex items-center">
<input autocomplete="current-password" class="w-full h-14 pl-4 pr-12 font-label-sub-english text-label-sub-english text-on-surface bg-surface-container-lowest rounded-xl shadow-sm placeholder:text-outline focus:outline-none focus:bg-surface-bright transition-colors tracking-widest" id="password" placeholder="••••••••" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-3 p-2 text-outline hover:text-primary transition-colors flex items-center justify-center cursor-pointer focus:outline-none" id="toggle-password" type="button">
<span class="material-symbols-outlined text-headline-md" id="eye-icon">visibility</span>
</button>
</div>
</div>
<!-- Forgot Password Link -->
<div class="flex justify-end mb-space-lg mt-2">
<a class="font-label-sub-english text-label-sub-english font-medium text-primary hover:text-on-primary-fixed-variant transition-colors" href="#">
            Password bhool gaye
          </a>
</div>
<!-- Primary Submit Button -->
<button class="w-full h-16 bg-primary hover:bg-primary-container active:scale-[0.99] text-on-primary rounded-xl shadow-md transition-all flex items-center justify-center gap-space-sm px-6 cursor-pointer focus:outline-none" type="submit">
<span class="material-symbols-outlined text-headline-lg flex-shrink-0" style="font-variation-settings: 'FILL' 1;">
            login
          </span>
<div class="flex flex-col items-center justify-center leading-tight">
<span class="font-title-hinglish text-title-hinglish font-bold text-on-primary">
              Login Karo
            </span>
<span class="font-label-sub-english text-label-sub-english font-normal text-on-primary/90">
              Sign in
            </span>
</div>
</button>
</form>
</div>
</div>
<script>
    const toggleBtn = document.getElementById('toggle-password');
    const passwordInput = document.getElementById('password');
    const eyeIcon = document.getElementById('eye-icon');

    if (toggleBtn && passwordInput && eyeIcon) {
      toggleBtn.addEventListener('click', () => {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });
    }
  </script>
</div></main></body></html>
